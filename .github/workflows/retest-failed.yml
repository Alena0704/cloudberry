name: Re-run failed PR CI

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: retest-failed-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  retest:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/retest-failed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # issue_comment uses the default branch commit, never the PR's code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Re-run failed jobs for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/retest_failed.py
